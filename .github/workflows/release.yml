name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: read

jobs:
  emit:
    # Bend emits one portable C program; every platform compiles that same file.
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - run: sh scripts/setup-bend-ci.sh
      - run: bun scripts/check-native-safety.ts
      - run: bend native/main.bend -o jev-fabric.c
      - uses: actions/upload-artifact@v4
        with:
          name: jev-fabric-c
          path: jev-fabric.c
          if-no-files-found: error

  build:
    needs: emit
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux compiles inside manylinux_2_28 (AlmaLinux 8) so the executable
          # needs glibc 2.28 at most. Bend's C needs clang, not GCC.
          - platform: linux-x64
            runner: ubuntu-22.04
            image: quay.io/pypa/manylinux_2_28_x86_64
            cflags: ''
            libs: -ldl
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            cflags: ''
            libs: -ldl
          - platform: darwin-universal
            runner: macos-latest
            cflags: -arch arm64 -arch x86_64 -mmacosx-version-min=11.0
            libs: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: jev-fabric-c
      - name: Compile (the flags Bend 2.0.34 uses)
        if: ${{ !matrix.image }}
        run: |
          mkdir -p build
          clang -std=c11 -O3 ${{ matrix.cflags }} jev-fabric.c -lpthread -lm ${{ matrix.libs }} -o build/jev-fabric
      - name: Compile against an older glibc
        if: ${{ matrix.image }}
        run: |
          mkdir -p build
          docker run --rm -v "$PWD:/w" -w /w ${{ matrix.image }} sh -c '
            set -eu
            dnf install -y -q clang binutils >/dev/null
            clang -std=c11 -O3 ${{ matrix.cflags }} jev-fabric.c -lpthread -lm ${{ matrix.libs }} -o build/jev-fabric
            newest=$(readelf -V build/jev-fabric | grep -o "GLIBC_[0-9.]*" | sed "s/GLIBC_//" | sort -uV | tail -1)
            echo "newest glibc symbol: $newest"
            [ "$(printf "%s\n2.28\n" "$newest" | sort -V | tail -1)" = "2.28" ]
          '
          sudo chown "$(id -u):$(id -g)" build/jev-fabric
      - name: Smoke test
        run: |
          set -eux
          tag="${{ inputs.tag || github.ref_name }}"
          build/jev-fabric -- --version | grep -q "^${tag#v}-native"
          build/jev-fabric -- --help | grep -q 'usage: jev-fabric'
          build/jev-fabric -- exec /bin/echo ok | grep -q '"stdout":"ok\\u000a"'
          build/jev-fabric -- validate examples/native/request.json >/dev/null
          id=$(build/jev-fabric -- start /bin/sh -c 'echo ready' | sed 's/.*"id":"\([0-9a-f]*\)".*/\1/')
          build/jev-fabric -- wait "$id" | grep -q '"state":"exited"'
          printf '{"id":1,"op":"exec","argv":["/bin/echo","ok"]}\n' | build/jev-fabric -- serve | grep -q '"id":1,"ok":true'
      - run: sh scripts/package-release.sh ${{ matrix.platform }} build/jev-fabric
      - uses: actions/upload-artifact@v4
        with:
          name: jev-fabric-${{ matrix.platform }}
          path: dist/jev-fabric-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: jev-fabric-*-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -la
          sha256sum jev-fabric-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS \
              --title "jev-fabric $tag" --notes-file .github/release-notes.md --verify-tag
          fi

  npm:
    # Per-platform packages carry the executable; `jev-fabric` carries the
    # launcher, binaryPath() and the clients. Publishing needs an NPM_TOKEN
    # secret; without it the packages are only built and uploaded as artifacts.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: jev-fabric-*-*
          path: dist
          merge-multiple: true
      - run: node scripts/package-npm.mjs dist npm-out
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm-out/*.tgz
          if-no-files-found: error
      - name: Publish to npm
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: |
          set -eu
          # Platform packages first, so `jev-fabric` never points at a missing version.
          for pass in platform main; do
            for tarball in npm-out/*.tgz; do
              spec=$(tar -xzOf "$tarball" package/package.json | node -p 'const p=JSON.parse(require("fs").readFileSync(0,"utf8")); p.name+"@"+p.version')
              case "$pass:${spec%@*}" in platform:jev-fabric|main:jev-fabric-*) continue ;; esac
              if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then echo "$spec already published"; continue; fi
              npm publish "$tarball" --access public --provenance
            done
          done
